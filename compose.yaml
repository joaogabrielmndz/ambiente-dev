services:
  app:
    build: .
    volumes:
      - .:/var/www/html

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      
  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_DATABASE=teste
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

